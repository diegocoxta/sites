version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 14
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    assignees:
      - 'diegocoxta'
