name: Dependabot

on:
  schedule:
    # 11:00 no horário da Bahia
    - cron: '0 11 * * *'
      timezone: 'America/Bahia'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - id: prs
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" --state open \
            --json number,url,headRefName,isDraft,mergeable,commits \
            --jq '[.[]
                   | select(.isDraft | not)
                   | select(.mergeable != "CONFLICTING")
                   | select([.commits[0].messageBody | scan("update-type: (\\S+)")[0]]
                            | length > 0 and all(. == "version-update:semver-patch" or . == "version-update:semver-minor"))
                   | {number, url, branch: .headRefName}]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "$prs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  merge:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Um por vez: cada merge muda a main antes do próximo.
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    name: merge #${{ matrix.pr.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.pr.branch }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: npx tsc --noEmit
      - name: Wait for the other checks
        run: |
          while gh pr checks "$PR_URL" --json workflow,bucket --jq '.[] | select(.workflow != "Dependabot" and .bucket == "pending")' | grep -q .; do
            sleep 30
          done
          failed=$(gh pr checks "$PR_URL" --json workflow,bucket --jq '[.[] | select(.workflow != "Dependabot" and .bucket == "fail")] | length' || true)
          [ "$failed" = 0 ]
        env:
          PR_URL: ${{ matrix.pr.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ matrix.pr.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
