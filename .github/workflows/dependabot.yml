name: Dependabot

on:
  schedule:
    # 20:17 no horário da Bahia (minuto fora do início da hora, onde o GitHub atrasa ou descarta runs)
    - cron: '17 20 * * *'
      timezone: 'America/Bahia'
  workflow_dispatch:

# Cada job declara só o que precisa.
permissions: {}

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      # PRs abertos do Dependabot, sem draft, sem conflito e só patch/minor.
      # Majors ficam manuais: não há suíte de testes para pegar mudança de comportamento.
      # Dependência indireta (só no lockfile) vem sem "update-type:" no commit, então o tipo
      # sai da comparação "from X to Y": mesmo major (e mesmo minor, quando o major é 0).
      - id: prs
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" --state open \
            --json number,url,headRefOid,isDraft,mergeable,commits \
            --jq 'def types: [.commits[0].messageBody | scan("update-type: (\\S+)")[0]];
                  def safeIndirect: .commits[0].messageBody
                    | contains("dependency-type: indirect")
                      and (capture("from (?<a>\\d+)\\.(?<ai>\\d+)\\S* to (?<b>\\d+)\\.(?<bi>\\d+)")?
                           | . != null and .a == .b and (.a != "0" or .ai == .bi));
                  [.[]
                   | select(.isDraft | not)
                   | select(.mergeable != "CONFLICTING")
                   | select((types | length > 0 and all(. == "version-update:semver-patch" or . == "version-update:semver-minor"))
                            or (types | length == 0) and safeIndirect)
                   | {number, url, sha: .headRefOid}]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "$prs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Roda o código do PR (install, lint, build...) sem nenhuma permissão de escrita nem segredo:
  # se uma dependência for maliciosa, não há token útil para roubar.
  verify:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    name: 'verify #${{ matrix.pr.number }}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.pr.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: npx tsc --noEmit

  # Só chamadas à API: nenhum código do PR roda aqui.
  merge:
    needs: [list, verify]
    if: ${{ !cancelled() && needs.list.result == 'success' && needs.list.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    strategy:
      # Um por vez: cada merge muda a main antes do próximo.
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    name: 'merge #${{ matrix.pr.number }}'
    steps:
      # O needs espera a matriz inteira do verify, então confere o job deste PR.
      - name: Check verify result
        run: |
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq ".jobs[] | select(.name == \"verify #$PR_NUMBER\") | .conclusion")
          echo "verify #$PR_NUMBER: $conclusion"
          [ "$conclusion" = success ]
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O merge acontece aqui, não via branch protection, então os outros workflows e os
      # checks da Vercel são verificados à mão: mergear com algum pendente ou falho é errado.
      # Cancelled é ok (o Ignored Build Step da Vercel cancela a maioria), só failed bloqueia.
      - name: Wait for the other checks
        run: |
          while gh pr checks "$PR_URL" --json workflow,bucket --jq '.[] | select(.workflow != "Dependabot" and .bucket == "pending")' | grep -q .; do
            sleep 30
          done
          failed=$(gh pr checks "$PR_URL" --json workflow,bucket --jq '[.[] | select(.workflow != "Dependabot" and .bucket == "fail")] | length' || true)
          [ "$failed" = 0 ]
        env:
          PR_URL: ${{ matrix.pr.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --match-head-commit: só mergeia o commit que foi verificado; se o Dependabot
      # fez rebase no meio do caminho, falha e fica para a próxima execução.
      - run: gh pr merge --squash --match-head-commit "$PR_SHA" "$PR_URL"
        env:
          PR_URL: ${{ matrix.pr.url }}
          PR_SHA: ${{ matrix.pr.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
